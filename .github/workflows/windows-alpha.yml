name: Windows alpha

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned application and build dependencies
        # 4.3 corrupts compiled-method storage during Qt signal connection.
        # Maintainer-confirmed regression: https://github.com/Nuitka/Nuitka/issues/4081
        run: python -m pip install -e . Nuitka==4.2.2
      - name: Prepare pinned restoration model in an isolated build-only environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $converterRoot = Join-Path $env:RUNNER_TEMP 'edivora-model-converter'
          python -m venv $converterRoot
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create converter environment' }
          $converter = Join-Path $converterRoot 'Scripts/python.exe'
          & $converter -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install pinned PyTorch converter' }
          & $converter -m pip install onnx==1.23.2 numpy==2.5.4 onnxruntime==1.31.0
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install pinned ONNX conversion dependencies' }
          & $converter tools/prepare_restoration_model.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned model conversion or CPU verification failed' }
          python -c "import importlib.util; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('onnx') is None; import onnxruntime"
          if ($LASTEXITCODE -ne 0) { throw 'Build-only converter packages leaked into the application environment' }
      - name: Core, adapter and Qt tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests tools
      - name: Prepare and verify bundled model (build time only)
        run: python tools/prepare_model.py
      - name: Prepare and verify pinned offline voice model (build time only)
        run: python tools/prepare_voice_model.py
      - name: Exercise the real source worker
        run: python -m local_ai_photo_editor --smoke-test test-results/source-worker
      - name: Exercise real AI subject selection and native source dialogs
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/verify_subject_tools.py test-results/source-subject
      - name: Open source GUI with synthetic pixels
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          python -m local_ai_photo_editor --ui-smoke-test test-results/source-gui
          $smokeExit = $LASTEXITCODE
          if ($smokeExit -ne 0) {
            foreach ($file in @('test-results/source-gui/ui-smoke-result.json', 'test-results/source-gui/ui-startup.json')) {
              if (Test-Path $file) {
                Write-Host "Native GUI smoke diagnostic: $file"
                Get-Content $file
              }
            }
            exit $smokeExit
          }
      - name: Verify source launcher, media editor shells and real local exports
        env:
          QT_QPA_PLATFORM: windows
        run: python -m local_ai_photo_editor --media-smoke-test test-results/source-media
      - name: Verify responsive suite and real new AI from source
        env:
          QT_QPA_PLATFORM: windows
        run: python -m local_ai_photo_editor --suite-smoke-test test-results/source-suite
      - name: Verify source suite at 150 percent scaling
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
        run: python -m local_ai_photo_editor --suite-smoke-test test-results/source-suite-dpi150
      - name: Restore native compiler cache
        id: compiler_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/local-ai-photo-editor-clcache
          key: windows-2022-x64-python312-nuitka422-${{ hashFiles('pyproject.toml', 'tools/build_windows.py', 'tools/package_boundary.py') }}-${{ github.sha }}
          restore-keys: |
            windows-2022-x64-python312-nuitka422-${{ hashFiles('pyproject.toml', 'tools/build_windows.py', 'tools/package_boundary.py') }}-
      - name: Build standalone application
        id: standalone_build
        env:
          NUITKA_CACHE_DIR_CLCACHE: ${{ runner.temp }}/local-ai-photo-editor-clcache
        run: python tools/build_windows.py
      - name: Save native compiler cache after successful compilation
        if: ${{ !cancelled() && steps.standalone_build.outcome == 'success' && steps.compiler_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/local-ai-photo-editor-clcache
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
      - name: Exercise packaged worker from a temporary working directory
        if: ${{ !cancelled() && steps.standalone_build.outcome == 'success' }}
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $appPath = (Resolve-Path 'dist/LocalAiPhotoEditor/LocalAiPhotoEditor.exe').Path
          $workerOutput = Join-Path $env:GITHUB_WORKSPACE 'test-results/frozen-worker'
          $worker = Start-Process -FilePath $appPath -ArgumentList "--smoke-test `"$workerOutput`"" -WorkingDirectory $env:RUNNER_TEMP -PassThru -Wait
          if ($worker.ExitCode -ne 0) { throw "Packaged worker failed: $($worker.ExitCode)" }
      - name: Verify subject selection inside the compiled worker
        if: ${{ !cancelled() && steps.standalone_build.outcome == 'success' }}
        run: python tools/verify_subject_tools.py test-results/frozen-subject --executable dist/LocalAiPhotoEditor/LocalAiPhotoEditor.exe
      - name: Open packaged GUI from a temporary working directory
        if: ${{ !cancelled() && steps.standalone_build.outcome == 'success' }}
        env:
          QT_DEBUG_PLUGINS: '1'
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'windows'
          $appPath = (Resolve-Path 'dist/LocalAiPhotoEditor/LocalAiPhotoEditor.exe').Path
          $guiOutput = Join-Path $env:GITHUB_WORKSPACE 'test-results/frozen-gui'
          $gui = Start-Process -FilePath $appPath -ArgumentList "--ui-smoke-test `"$guiOutput`"" -WorkingDirectory $env:RUNNER_TEMP -PassThru -Wait
          if ($gui.ExitCode -ne 0) { throw "Packaged GUI failed: $($gui.ExitCode)" }
      - name: Verify packaged launcher, editors and media export outside the repo
        if: ${{ !cancelled() && steps.standalone_build.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $appPath = (Resolve-Path 'dist/LocalAiPhotoEditor/LocalAiPhotoEditor.exe').Path
          $mediaOutput = Join-Path $env:GITHUB_WORKSPACE 'test-results/frozen-media'
          $media = Start-Process -FilePath $appPath -ArgumentList "--media-smoke-test `"$mediaOutput`"" -WorkingDirectory $env:RUNNER_TEMP -PassThru -Wait
          if ($media.ExitCode -ne 0) {
            if (Test-Path (Join-Path $mediaOutput 'media-smoke.json')) {
              Get-Content (Join-Path $mediaOutput 'media-smoke.json')
            }
            throw "Packaged media and launcher smoke failed: $($media.ExitCode)"
          }
      - name: Verify standalone responsive suite and real DnCNN without source imports
        if: ${{ !cancelled() && steps.standalone_build.outcome == 'success' }}
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'windows'
          $appPath = (Resolve-Path 'dist/LocalAiPhotoEditor/LocalAiPhotoEditor.exe').Path
          foreach ($scale in @('1', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            $out = Join-Path $env:GITHUB_WORKSPACE "test-results/frozen-suite-dpi$scale"
            $suite = Start-Process -FilePath $appPath -ArgumentList "--suite-smoke-test `"$out`"" -WorkingDirectory $env:RUNNER_TEMP -PassThru -Wait
            if ($suite.ExitCode -ne 0) {
              if (Test-Path (Join-Path $out 'suite-smoke.json')) { Get-Content (Join-Path $out 'suite-smoke.json') }
              throw "Standalone suite failed: $($suite.ExitCode)"
            }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Add successful runtime verification to the portable package
        run: |
          Copy-Item -Recurse test-results dist/LocalAiPhotoEditor/verification
      - name: Upload checked portable alpha
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LocalAiPhotoEditor-windows-x64-alpha
          path: dist/LocalAiPhotoEditor/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-windows
          path: |
            test-results/
            build/nuitka-report.xml
            dist/LocalAiPhotoEditor/build-info.json
            dist/LocalAiPhotoEditor/third-party-licenses/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve failed runtime package for diagnosis
        if: ${{ failure() && steps.standalone_build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-package-windows-x64
          path: dist/LocalAiPhotoEditor/
          if-no-files-found: error
          retention-days: 3
