name: Fast Python checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/capture_editing_ui.py'
      - 'pyproject.toml'
      - '.github/workflows/python-checks.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/capture_editing_ui.py'
      - 'pyproject.toml'
      - '.github/workflows/python-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt headless runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0 libpulse0
      - name: Install pinned application dependencies
        run: python -m pip install -e .
      - name: Run core, project, UI and protocol unit tests
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results/unit-tests.txt
      - name: Check Python compilation
        run: python -m compileall -q src tests tools
      - name: Capture German and English editing workspaces
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
        run: python tools/capture_editing_ui.py test-results/editing-ui
      - name: Retain test results and source UI captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editing-verification-${{ runner.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
