name: Fast Python checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/capture_editing_ui.py'
      - 'pyproject.toml'
      - '.github/workflows/python-checks.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/capture_editing_ui.py'
      - 'pyproject.toml'
      - '.github/workflows/python-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Qt headless runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0 libpulse0
      - name: Install pinned application dependencies
        run: python -m pip install -e .
      - name: Run core, project, UI and protocol unit tests
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results/unit-tests.txt
      - name: Verify responsive layouts at 150 and 200 percent scale
        shell: bash
        run: |
          QT_SCALE_FACTOR=1.5 python -m unittest discover -s tests -p test_responsive_suite.py -v
          QT_SCALE_FACTOR=2 python -m unittest discover -s tests -p test_responsive_suite.py -v
      - name: Check Python compilation
        run: python -m compileall -q src tests tools
      - name: Capture German and English editing workspaces
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
        run: python tools/capture_editing_ui.py test-results/editing-ui
      - name: Summarize local test evidence without upload
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path('test-results')
          captures = sum(1 for item in root.rglob('*.png')) if root.exists() else 0
          log = root / 'unit-tests.txt'
          print(f"Local UI captures: {captures}; unit test transcript: {'present' if log.exists() else 'unavailable'}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"### Source verification: {os.environ.get('RUNNER_OS', 'unknown')}\n\n")
              summary.write(f"UI captures created locally: {captures}; test output is available in job logs.\n")
          PY
