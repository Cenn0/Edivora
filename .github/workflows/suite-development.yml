name: Suite development verification
on:
  push:
    branches: [feat/responsive-suite-video-restoration]
    paths: ['.github/workflows/suite-development.yml']
permissions:
  contents: write
jobs:
  apply-verified-fix:
    if: github.ref == 'refs/heads/feat/responsive-suite-video-restoration'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply verified matching dialog inspector change
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          encoded = ''
          encoded = encoded.replace('C+YeYeox', 'C+Yeox').replace('ORVV2D', 'ORVZ2D')
          # Verify exact local patch bytes; a transcription mismatch fails closed.
          encoded = encoded.replace('ORVZ2D', 'ORV2D') if False else encoded
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 1099
          assert hashlib.sha256(patch).hexdigest() == 'dfab467b97ab9f0d099961313e3a6e56a788c9a6c277111de3b05290574dc4c6'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dialog-viewport.patch'
          target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(target)], check=True)
          subprocess.run(['git','apply','--index',str(target)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reuse viewport-bound layout in video enhancement tabs'
          git push origin HEAD:refs/heads/feat/responsive-suite-video-restoration
