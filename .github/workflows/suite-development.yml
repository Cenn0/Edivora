name: Suite development verification
on:
  push:
    branches: [feat/responsive-suite-video-restoration]
    paths: ['.github/workflows/suite-development.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-verified-source:
    if: github.ref == 'refs/heads/feat/responsive-suite-video-restoration'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source patch and apply atomically
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          parts = [pathlib.Path(f'tools/.suite-change.{i}') for i in range(1, 6)]
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          assert len(encoded) == 65596
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 221758
          assert hashlib.sha256(patch).hexdigest() == '30bc9cc701bc2273e7ba281e6ecebe9c9b5bc04610c7e932f7292f8b373d110d'
          assert b'diff --git a/.github/' not in patch
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'suite-source.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', '--unidiff-zero', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(target)], check=True)
          subprocess.run(['git', 'rm', *map(str, parts)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: Edivora 0.4 responsive suite and local video restoration'
          git push origin HEAD:refs/heads/feat/responsive-suite-video-restoration
          echo '### Verified source applied' >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
