name: Suite development verification
on:
  push:
    branches: [feat/responsive-suite-video-restoration]
    paths: ['.github/workflows/suite-development.yml']
permissions:
  contents: write
jobs:
  apply-verified-fix:
    if: github.ref == 'refs/heads/feat/responsive-suite-video-restoration'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply exact Windows regression fix
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 7089
          assert hashlib.sha256(patch).hexdigest() == '0e03c09e2a138f4e8acf6454063caac8e653fab179d374422cec138a676b996d'
          assert b'diff --git a/.github/' not in patch
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'windows-fix.patch'
          target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(target)], check=True)
          subprocess.run(['git','apply','--index',str(target)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: Windows writable export sync and compact inspector labels'
          git push origin HEAD:refs/heads/feat/responsive-suite-video-restoration
