name: Suite development verification
on:
  push:
    branches: [feat/responsive-suite-video-restoration]
    paths: ['.github/workflows/suite-development.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Acquire candidate bytes without deserializing
        shell: bash
        run: |
          mkdir -p verification
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          url = 'https://github.com/cszn/KAIR/releases/download/v1.0/dncnn_color_blind.pth'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(2678122)
          assert len(data) == 2678121
          report = {'url': url, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'deserialized': False}
          pathlib.Path('verification/model-provenance.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: restoration-provenance
          path: verification/
          retention-days: 7
