name: Suite development verification
on:
  push:
    branches: [feat/responsive-suite-video-restoration]
    paths: ['.github/workflows/suite-development.yml']
permissions:
  contents: write
jobs:
  apply-verified-fix:
    if: github.ref == 'refs/heads/feat/responsive-suite-video-restoration'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply exact locally tested dialog update
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('src/local_ai_photo_editor/ui/video_dialog.py')
          before = p.read_bytes()
          assert hashlib.sha256(before).hexdigest() == '57a25c13abded07ebb7fbab71ae17bc6a89ae53d4332b4cf013ea264701c5ab6'
          after = before.replace(b'from .responsive import ElideLabel, WrappedCheckBox, fit_initial_window', b'from .responsive import ElideLabel, VerticalScrollArea, WrappedCheckBox, fit_initial_window').replace(b'        scroll = QScrollArea()', b'        scroll = VerticalScrollArea()')
          assert hashlib.sha256(after).hexdigest() == '961955592773fb4df79ad1a7a769738509c22276a14ce74a285f6eaad8302ee7'
          p.write_bytes(after)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/local_ai_photo_editor/ui/video_dialog.py
          git commit -m 'fix: reuse viewport-bound layout in video enhancement tabs'
          git push origin HEAD:refs/heads/feat/responsive-suite-video-restoration
