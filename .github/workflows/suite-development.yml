name: Suite development verification
on:
  push:
    branches: [feat/responsive-suite-video-restoration]
    paths: ['.github/workflows/suite-development.yml']
permissions:
  contents: write
jobs:
  apply-verified-fix:
    if: github.ref == 'refs/heads/feat/responsive-suite-video-restoration'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply exact viewport reflow change
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 5051
          assert hashlib.sha256(patch).hexdigest() == '20610307659aac3c0b50882a60f256c24b305971e035177a95fbffd879db74be'
          assert b'diff --git a/.github/' not in patch
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'viewport-fix.patch'
          target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(target)], check=True)
          subprocess.run(['git','apply','--index',str(target)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reflow vertical inspectors when native scrollbars reduce viewport width'
          git push origin HEAD:refs/heads/feat/responsive-suite-video-restoration
