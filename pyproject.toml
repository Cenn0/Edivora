[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "edivora"
version = "0.1.0a1"
description = "Edivora: a beginner-friendly local creative toolkit, starting with AI-assisted photo editing."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{name = "Edivora contributors"}]
dependencies = [
    "Pillow==12.3.0",
    "numpy==2.5.4",
    "PySide6==6.12.0",
    "onnxruntime==1.31.0",
]

[project.gui-scripts]
edivora = "local_ai_photo_editor.__main__:main"
local-ai-photo-editor = "local_ai_photo_editor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_ai_photo_editor = ["models/*.json", "models/*.onnx", "models/*.txt", "assets/*.svg"]

[tool.pyside6.deploy]
title = "Edivora"
input_file = "main.py"
exec_directory = "dist"
mode = "standalone"

